services:
  postgres:
    image: postgres:14.14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sol_scanner_e2e
    ports:
      - "15442:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sol_scanner_e2e"]
      interval: 1s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    ports:
      - "19092:19092"
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # shortcut: mainnet getBlock JSON often 1.5–4MiB; 32MiB is e2e/prod client cap — raise + retest if larger blocks appear.
      KAFKA_MESSAGE_MAX_BYTES: 33554432
      KAFKA_REPLICA_FETCH_MAX_BYTES: 33554432
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 33554432
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:19092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 20s
